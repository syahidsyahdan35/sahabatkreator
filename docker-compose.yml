# Infrastruktur lokal Sahabat Kreator (RANCANGAN §8): Postgres + pgvector, Redis.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sahabat-kreator-db
    environment:
      POSTGRES_USER: sahabat
      POSTGRES_PASSWORD: sahabat
      POSTGRES_DB: sahabat_kreator
    ports:
      - "5432:5432"
    volumes:
      - sahabat-db-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: sahabat-kreator-redis
    ports:
      - "6379:6379"
    volumes:
      - sahabat-redis-data:/data

volumes:
  sahabat-db-data:
  sahabat-redis-data:
