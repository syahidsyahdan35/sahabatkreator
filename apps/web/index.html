<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sahabat Kreator</title>
    <meta name="description" content="Inbox multi-channel, agen AI, dan automasi untuk kreator." />
    <meta name="theme-color" content="#2563eb" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sahabat Kreator" />
    <meta property="og:title" content="Sahabat Kreator" />

    <meta property="og:image" content="/brand/logo-1024.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/brand/logo-1024.png" />

    <script>
      // Anti-FOUC tema (RANCANGAN §10.3): terapkan class 'dark' sebelum render pertama.
      (function () {
        try {
          var mode = localStorage.getItem("sk-theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
