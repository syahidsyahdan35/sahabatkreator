# Web statis Sahabat Kreator (container target `web`).
# Hanya melayani dist SPA — /api, /realtime, /go diteruskan oleh nginx
# host ke container api/realtime, BUKAN oleh container ini.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aset Vite bernama hash — aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: rute aplikasi selalu kembali ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
